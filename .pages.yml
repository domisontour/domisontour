# Upload-Panel für Domis on Tour (Pages CMS: https://app.pagescms.org)
media:
  input: public/uploads
  output: /uploads
  rename: safe
  categories: [image, video]

content:
  # ---------------- Tagebuch ----------------
  - name: diary
    label: Tagebuch
    type: collection
    path: src/content/diary
    format: yaml-frontmatter
    filename:
      template: "{year}-{month}-{primary}.md"
      field: create
    view:
      fields: [title_de, date, place]
      primary: title_de
      sort: [date]
      default:
        sort: date
        order: desc
    fields:
      - name: title_de
        label: Titel (Deutsch)
        type: string
        required: true
      - name: title_en
        label: Titel (Englisch)
        type: string
        description: Leer lassen, dann wird der deutsche Titel angezeigt.
      - name: date
        label: Datum
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: trip
        label: Gehört zur Reise
        type: reference
        options:
          collection: trips
          search: title_de
          label: "{fields.title_de}"
      - name: place
        label: Ort
        type: string
        description: z. B. Addo Elephant National Park
      - name: lat
        label: Breitengrad (für die Karte)
        type: number
        description: "Optional. In Google Maps Rechtsklick auf den Ort, erste Zahl kopieren (z. B. -33.4461)."
      - name: lng
        label: Längengrad (für die Karte)
        type: number
        description: "Optional. Zweite Zahl aus Google Maps (z. B. 25.7458)."
      - name: cover
        label: Titelbild
        type: image
      - name: text_de
        label: Text (Deutsch)
        type: rich-text
        options:
          format: markdown
      - name: text_en
        label: Text (Englisch)
        type: rich-text
        description: Optional. Leer lassen, dann erscheint der deutsche Text mit Hinweis.
        options:
          format: markdown
      - name: photos
        label: Fotos
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.caption_de}"
        fields:
          - name: image
            label: Foto
            type: image
            required: true
          - name: caption_de
            label: Bildtext (Deutsch)
            type: string
          - name: caption_en
            label: Bildtext (Englisch)
            type: string
      - name: draft
        label: Entwurf (noch nicht veröffentlichen)
        type: boolean
        default: false

  # ---------------- Reisen ----------------
  - name: trips
    label: Reisen
    type: collection
    path: src/content/trips
    format: yaml-frontmatter
    filename:
      template: "{primary}-{year}.md"
      field: create
    view:
      fields: [title_de, start]
      primary: title_de
      default:
        sort: start
        order: desc
    fields:
      - name: title_de
        label: Name der Reise (Deutsch)
        type: string
        required: true
        description: z. B. Südafrika oder Hawaii
      - name: title_en
        label: Name der Reise (Englisch)
        type: string
      - name: start
        label: Startdatum
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: end
        label: Enddatum
        type: date
        default: ""
        options:
          format: yyyy-MM-dd
      - name: countries
        label: Länder (zweistelliger Code)
        type: string
        list: true
        description: "z. B. ZA = Südafrika, US = USA, MU = Mauritius, CH = Schweiz, TH = Thailand, PT = Portugal"
      - name: cover
        label: Titelbild
        type: image
      - name: summary_de
        label: Kurzbeschreibung (Deutsch)
        type: text
      - name: summary_en
        label: Kurzbeschreibung (Englisch)
        type: text
      - name: text_de
        label: Reisebericht (Deutsch)
        type: rich-text
        options:
          format: markdown
      - name: text_en
        label: Reisebericht (Englisch)
        type: rich-text
        options:
          format: markdown
      - name: best_time_de
        label: Beste Reisezeit (Deutsch)
        type: string
      - name: best_time_en
        label: Beste Reisezeit (Englisch)
        type: string
      - name: budget_de
        label: Budget (Deutsch)
        type: string
        description: z. B. ca. CHF 4'500 pro Person inkl. Flug
      - name: budget_en
        label: Budget (Englisch)
        type: string
      - name: tip_de
        label: Unser Tipp (Deutsch)
        type: text
      - name: tip_en
        label: Unser Tipp (Englisch)
        type: text
      - name: stops
        label: Route (Stopps in Reihenfolge)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.name}"
        fields:
          - name: name
            label: Ort
            type: string
            required: true
          - name: lat
            label: Breitengrad
            type: number
            required: true
            description: In Google Maps Rechtsklick auf den Ort, erste Zahl.
          - name: lng
            label: Längengrad
            type: number
            required: true
            description: Zweite Zahl aus Google Maps.
          - name: note_de
            label: Notiz (Deutsch)
            type: string
          - name: note_en
            label: Notiz (Englisch)
            type: string
      - name: show_route
        label: Route als Linie auf der Karte zeigen
        type: boolean
        default: true
      - name: gallery
        label: Fotogalerie
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.caption_de}"
        fields:
          - name: image
            label: Foto
            type: image
            required: true
          - name: caption_de
            label: Bildtext (Deutsch)
            type: string
          - name: caption_en
            label: Bildtext (Englisch)
            type: string
      - name: draft
        label: Entwurf (noch nicht veröffentlichen)
        type: boolean
        default: false

  # ---------------- Reiseziele (Länderseiten) ----------------
  - name: destinations
    label: Reiseziele (Infos und Tipps pro Land)
    type: collection
    path: src/content/destinations
    format: yaml-frontmatter
    filename:
      template: "{fields.country}.md"
      field: create
    view:
      fields: [country, name_de]
      primary: country
    fields:
      - name: country
        label: Land (zweistelliger Code)
        type: string
        required: true
        description: "z. B. ZA = Südafrika, IT = Italien, US = USA. Das Land erscheint automatisch im Menü unter Reisen."
      - name: name_de
        label: Anderer Name im Menü (Deutsch, optional)
        type: string
      - name: name_en
        label: Anderer Name im Menü (Englisch, optional)
        type: string
      - name: cover
        label: Titelbild
        type: image
      - name: intro_de
        label: Einleitung (Deutsch)
        type: rich-text
        description: "Folgt auf „Wir sind Herr Domi und Frou Domi,“. Leer lassen = automatischer Text."
        options:
          format: markdown
      - name: intro_en
        label: Einleitung (Englisch)
        type: rich-text
        options:
          format: markdown
      - name: highlights
        label: Highlights
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.title_de}"
        fields:
          - name: title_de
            label: Titel (Deutsch)
            type: string
            required: true
          - name: title_en
            label: Titel (Englisch)
            type: string
          - name: image
            label: Foto
            type: image
          - name: text_de
            label: Text (Deutsch)
            type: text
          - name: text_en
            label: Text (Englisch)
            type: text
      - name: routes_de
        label: Routen-Tipps (Deutsch)
        type: rich-text
        description: "Leer lassen = Abschnitt wird nicht angezeigt."
        options:
          format: markdown
      - name: routes_en
        label: Routen-Tipps (Englisch)
        type: rich-text
        options:
          format: markdown
      - name: best_time_de
        label: Reisezeit (Deutsch)
        type: rich-text
        description: "Leer lassen = Abschnitt wird nicht angezeigt."
        options:
          format: markdown
      - name: best_time_en
        label: Reisezeit (Englisch)
        type: rich-text
        options:
          format: markdown
      - name: stay_de
        label: Unterkünfte (Deutsch)
        type: rich-text
        description: "Leer lassen = Abschnitt wird nicht angezeigt."
        options:
          format: markdown
      - name: stay_en
        label: Unterkünfte (Englisch)
        type: rich-text
        options:
          format: markdown
      - name: car_de
        label: Mietwagen (Deutsch)
        type: rich-text
        description: "Leer lassen = Abschnitt wird nicht angezeigt."
        options:
          format: markdown
      - name: car_en
        label: Mietwagen (Englisch)
        type: rich-text
        options:
          format: markdown
      - name: packing_de
        label: Packliste (Deutsch)
        type: rich-text
        description: "Leer lassen = Abschnitt wird nicht angezeigt."
        options:
          format: markdown
      - name: packing_en
        label: Packliste (Englisch)
        type: rich-text
        options:
          format: markdown
      - name: costs_de
        label: Kosten (Deutsch)
        type: rich-text
        description: "Leer lassen = Abschnitt wird nicht angezeigt."
        options:
          format: markdown
      - name: costs_en
        label: Kosten (Englisch)
        type: rich-text
        options:
          format: markdown
      - name: tips_de
        label: Weitere Tipps (Deutsch)
        type: rich-text
        description: "Leer lassen = Abschnitt wird nicht angezeigt."
        options:
          format: markdown
      - name: tips_en
        label: Weitere Tipps (Englisch)
        type: rich-text
        options:
          format: markdown

  # ---------------- Allgemeines ----------------
  - name: site
    label: Über uns und Links
    type: file
    path: src/data/site.json
    format: json
    fields:
      - name: about_de
        label: Über uns (Deutsch)
        type: rich-text
        options:
          format: markdown
      - name: about_en
        label: Über uns (Englisch)
        type: rich-text
        options:
          format: markdown
      - name: hero_title_de
        label: Startseite Überschrift (Deutsch)
        type: string
      - name: hero_title_en
        label: Startseite Überschrift (Englisch)
        type: string
      - name: hero_lead_de
        label: Startseite Einleitungstext (Deutsch)
        type: text
      - name: hero_lead_en
        label: Startseite Einleitungstext (Englisch)
        type: text
      - name: hero
        label: Fotos oben auf der Startseite (max. 3 Polaroids)
        type: object
        description: "Reihenfolge: 1 = vorne rechts, 2 = links, 3 = hinten unten. Leer lassen = neueste Reisen werden gezeigt."
        list:
          max: 3
          collapsible:
            collapsed: true
            summary: "{index}: {fields.caption_de}"
        fields:
          - name: image
            label: Foto
            type: image
            required: true
          - name: caption_de
            label: Text auf dem Polaroid (Deutsch)
            type: string
          - name: caption_en
            label: Text auf dem Polaroid (Englisch)
            type: string
          - name: link
            label: Link beim Antippen (optional)
            type: string
            description: "z. B. /reisen/suedafrika-2026/ (leer lassen = kein Link)"
      - name: photo_couple
        label: Paarfoto für die Reiseziel-Seiten
        type: image
      - name: planning_links
        label: Links „Reise planen“ (auf jeder Reiseziel-Seite)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.provider}"
        fields:
          - name: label_de
            label: Bezeichnung (Deutsch)
            type: string
          - name: label_en
            label: Bezeichnung (Englisch)
            type: string
          - name: provider
            label: Anbieter
            type: string
          - name: url
            label: Link (z. B. euer Partner-Link)
            type: string
          - name: icon
            label: Symbol
            type: select
            options:
              values: [plane, bed, ticket, car, link]
      - name: photo_oreo
        label: Foto Oreo
        type: image
      - name: photo_herr
        label: Foto Herr Domi
        type: image
      - name: photo_frou
        label: Foto Frou Domi
        type: image
      - name: instagram
        label: Instagram-Link
        type: string
      - name: instagram_ugc
        label: Instagram-Link UGC-Konto
        type: string
      - name: tiktok
        label: TikTok-Link
        type: string
      - name: youtube
        label: YouTube-Link
        type: string
      - name: rednote
        label: RedNote-Link
        type: string
      - name: email
        label: Kontakt-E-Mail
        type: string
      - name: email_collab
        label: E-Mail für Kooperationen
        type: string

  # ---------------- Weltkarte ----------------
  - name: worldmap
    label: Weltkarte (bereiste Länder und Orte)
    type: file
    path: src/data/places.json
    format: json
    fields:
      - name: countries
        label: Bereiste Länder (zweistelliger Code)
        type: string
        list: true
        description: "z. B. FR = Frankreich, IT = Italien, US = USA, TH = Thailand, PT = Portugal. Länder aus Reisen werden automatisch ergänzt."
      - name: us_states
        label: Bereiste US-Bundesstaaten (Kürzel)
        type: string
        list: true
        description: "z. B. CA = Kalifornien, NV = Nevada, HI = Hawaii, FL = Florida, NY = New York"
      - name: places
        label: Besuchte Orte (Pins)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.name_de}"
        fields:
          - name: name_de
            label: Ort (Deutsch)
            type: string
            required: true
          - name: name_en
            label: Ort (Englisch)
            type: string
          - name: lat
            label: Breitengrad
            type: number
            required: true
            description: In Google Maps Rechtsklick auf den Ort, erste Zahl.
          - name: lng
            label: Längengrad
            type: number
            required: true
            description: Zweite Zahl aus Google Maps.
      - name: next_trips
        label: Als Nächstes (Reihenfolge und Zeitpunkt auf der Startseite)
        type: object
        description: "Reihenfolge per Ziehen ändern. Ländercode wie bei den geplanten Ländern, z. B. TH, US, NA."
        list:
          collapsible:
            collapsed: true
            summary: "{fields.country} · {fields.when_de}"
        fields:
          - name: country
            label: Land (zweistelliger Code)
            type: string
            required: true
          - name: when_de
            label: Wann (Deutsch)
            type: string
            description: "z. B. Januar 2027 oder Datum offen"
          - name: when_en
            label: Wann (Englisch)
            type: string
      - name: planned_countries
        label: Geplante Länder (zweistelliger Code)
        type: string
        list: true
        description: "Werden grün markiert und zählen noch nicht zum Prozentwert. Nach der Reise oben bei den bereisten Ländern eintragen und hier löschen."
      - name: planned_us_states
        label: Geplante US-Bundesstaaten (Kürzel)
        type: string
        list: true
      - name: planned_places
        label: Geplante Orte (Pins)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.name_de}"
        fields:
          - name: name_de
            label: Ort (Deutsch)
            type: string
            required: true
          - name: name_en
            label: Ort (Englisch)
            type: string
          - name: lat
            label: Breitengrad
            type: number
            required: true
          - name: lng
            label: Längengrad
            type: number
            required: true

  # ---------------- Zusammenarbeit ----------------
  - name: collab
    label: Zusammenarbeit (Seite für Brands)
    type: file
    path: src/data/collab.json
    format: json
    fields:
      - name: title_de
        label: Titel (Deutsch)
        type: string
      - name: title_en
        label: Titel (Englisch)
        type: string
      - name: lead_de
        label: Einleitung (Deutsch)
        type: text
      - name: lead_en
        label: Einleitung (Englisch)
        type: text
      - name: offers
        label: Angebote
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.title_de}"
        fields:
          - name: icon
            label: Symbol
            type: select
            options:
              values: [camera, video, phone, pin, plane, bed]
          - name: title_de
            label: Titel (Deutsch)
            type: string
          - name: title_en
            label: Titel (Englisch)
            type: string
          - name: text_de
            label: Beschreibung (Deutsch)
            type: text
          - name: text_en
            label: Beschreibung (Englisch)
            type: text
      - name: portfolio
        label: Beispiel-Fotos (Portfolio)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.caption_de}"
        fields:
          - name: image
            label: Foto
            type: image
            required: true
          - name: caption_de
            label: Bildtext (Deutsch)
            type: string
          - name: caption_en
            label: Bildtext (Englisch)
            type: string
      - name: why_de
        label: Warum mit uns (Deutsch)
        type: rich-text
        options:
          format: markdown
      - name: why_en
        label: Warum mit uns (Englisch)
        type: rich-text
        options:
          format: markdown
      - name: equipment_de
        label: Ausrüstung (Deutsch)
        type: string
      - name: equipment_en
        label: Ausrüstung (Englisch)
        type: string
      - name: languages_de
        label: Sprachen (Deutsch)
        type: string
      - name: languages_en
        label: Sprachen (Englisch)
        type: string
      - name: partners
        label: Bisherige Partner
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.name}"
        fields:
          - name: name
            label: Name
            type: string
            required: true
          - name: url
            label: Webseite (optional)
            type: string
      - name: mediakit
        label: Mediakit (PDF, optional)
        type: file
        options:
          categories: [document]

  # ---------------- Portfolio (UGC) ----------------
  - name: portfolio
    label: Portfolio (UGC für Brands)
    type: file
    path: src/data/portfolio.json
    format: json
    fields:
      - name: kicker_de
        label: Zeile über dem Namen (Deutsch)
        type: string
      - name: kicker_en
        label: Zeile über dem Namen (Englisch)
        type: string
      - name: name
        label: Name
        type: string
      - name: claim_de
        label: Slogan (Deutsch)
        type: string
      - name: claim_en
        label: Slogan (Englisch)
        type: string
      - name: tags_de
        label: Stichworte (Deutsch)
        type: string
        list: true
      - name: tags_en
        label: Stichworte (Englisch)
        type: string
        list: true
      - name: location_de
        label: Ort (Deutsch)
        type: string
      - name: location_en
        label: Ort (Englisch)
        type: string
      - name: hero
        label: Fotos oben (2 Polaroids)
        type: object
        list:
          max: 2
          collapsible:
            collapsed: true
            summary: "{fields.caption_de}"
        fields:
          - name: image
            label: Foto
            type: image
            required: true
          - name: caption_de
            label: Text auf dem Polaroid (Deutsch)
            type: string
          - name: caption_en
            label: Text auf dem Polaroid (Englisch)
            type: string
      - name: intro_title_de
        label: "Titel „Warum mit uns“ (Deutsch)"
        type: string
      - name: intro_title_en
        label: "Titel „Warum mit uns“ (Englisch)"
        type: string
      - name: intro_de
        label: "Text „Warum mit uns“ (Deutsch)"
        type: rich-text
        options:
          format: markdown
      - name: intro_en
        label: "Text „Warum mit uns“ (Englisch)"
        type: rich-text
        options:
          format: markdown
      - name: intro_video
        label: "Video neben „Warum mit uns“"
        type: object
        fields:
          - name: video
            label: Video (MP4, Hochformat)
            type: file
            required: true
            options:
              categories: [video]
          - name: poster
            label: Vorschaubild
            type: image
          - name: caption_de
            label: Bildtext (Deutsch)
            type: string
          - name: caption_en
            label: Bildtext (Englisch)
            type: string
      - name: intro_images
        label: "Fotos neben „Warum mit uns“ (max. 2)"
        type: object
        list:
          max: 2
          collapsible:
            collapsed: true
            summary: "{fields.caption_de}"
        fields:
          - name: image
            label: Foto
            type: image
            required: true
          - name: caption_de
            label: Bildtext (Deutsch)
            type: string
          - name: caption_en
            label: Bildtext (Englisch)
            type: string
      - name: perspectives_title_de
        label: Titel Perspektiven (Deutsch)
        type: string
      - name: perspectives_title_en
        label: Titel Perspektiven (Englisch)
        type: string
      - name: perspectives
        label: Drei Perspektiven (plus Oreo)
        type: object
        description: "Ohne Foto beim Oreo-Eintrag wird das Oreo-Foto aus „Über uns und Links“ verwendet."
        list:
          collapsible:
            collapsed: true
            summary: "{fields.title_de}"
        fields:
          - name: title_de
            label: Titel (Deutsch)
            type: string
            required: true
          - name: title_en
            label: Titel (Englisch)
            type: string
          - name: text_de
            label: Text (Deutsch)
            type: text
          - name: text_en
            label: Text (Englisch)
            type: text
          - name: image
            label: Foto
            type: image
      - name: videos
        label: UGC-Videos
        type: object
        description: "Reihenfolge per Ziehen ändern. Neue Videos am besten zuerst Claude schicken: Er verkleinert sie für die Website und lädt sie hoch. Hier könnt ihr Reihenfolge und Beschriftung ändern."
        list:
          collapsible:
            collapsed: true
            summary: "{fields.who} · {fields.label_de}"
        fields:
          - name: video
            label: Video (MP4, Hochformat)
            type: file
            required: true
            options:
              categories: [video]
          - name: poster
            label: Vorschaubild
            type: image
          - name: who
            label: Wer ist zu sehen (für den Filter)
            type: select
            options:
              values: [herr, frou, couple]
          - name: label_de
            label: Beschriftung (Deutsch)
            type: string
            description: z. B. Travel · Rucksack
          - name: label_en
            label: Beschriftung (Englisch)
            type: string
      - name: photos
        label: UGC-Fotos
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.caption_de}"
        fields:
          - name: image
            label: Foto
            type: image
            required: true
          - name: caption_de
            label: Bildtext (Deutsch)
            type: string
          - name: caption_en
            label: Bildtext (Englisch)
            type: string
      - name: locations_de
        label: Dreh-Locations Text (Deutsch)
        type: rich-text
        options:
          format: markdown
      - name: locations_en
        label: Dreh-Locations Text (Englisch)
        type: rich-text
        options:
          format: markdown
      - name: locations
        label: Dreh-Locations Fotos
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.caption_de}"
        fields:
          - name: image
