# Upload-Panel für Domis on Tour (Pages CMS: https://app.pagescms.org)
media:
  input: public/uploads
  output: /uploads
  rename: safe
  categories: [image]

content:
  # ---------------- Tagebuch ----------------
  - name: diary
    label: Tagebuch
    type: collection
    path: src/content/diary
    format: yaml-frontmatter
    filename:
      template: "{year}-{month}-{primary}.md"
      field: create
    view:
      fields: [title_de, date, place]
      primary: title_de
      sort: [date]
      default:
        sort: date
        order: desc
    fields:
      - name: title_de
        label: Titel (Deutsch)
        type: string
        required: true
      - name: title_en
        label: Titel (Englisch)
        type: string
        description: Leer lassen, dann wird der deutsche Titel angezeigt.
      - name: date
        label: Datum
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: trip
        label: Gehört zur Reise
        type: reference
        options:
          collection: trips
          search: title_de
          label: "{fields.title_de}"
      - name: place
        label: Ort
        type: string
        description: z. B. Addo Elephant National Park
      - name: lat
        label: Breitengrad (für die Karte)
        type: number
        description: "Optional. In Google Maps Rechtsklick auf den Ort, erste Zahl kopieren (z. B. -33.4461)."
      - name: lng
        label: Längengrad (für die Karte)
        type: number
        description: "Optional. Zweite Zahl aus Google Maps (z. B. 25.7458)."
      - name: cover
        label: Titelbild
        type: image
      - name: text_de
        label: Text (Deutsch)
        type: rich-text
        options:
          format: markdown
      - name: text_en
        label: Text (Englisch)
        type: rich-text
        description: Optional. Leer lassen, dann erscheint der deutsche Text mit Hinweis.
        options:
          format: markdown
      - name: photos
        label: Fotos
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.caption_de}"
        fields:
          - name: image
            label: Foto
            type: image
            required: true
          - name: caption_de
            label: Bildtext (Deutsch)
            type: string
          - name: caption_en
            label: Bildtext (Englisch)
            type: string
      - name: draft
        label: Entwurf (noch nicht veröffentlichen)
        type: boolean
        default: false

  # ---------------- Reisen ----------------
  - name: trips
    label: Reisen
    type: collection
    path: src/content/trips
    format: yaml-frontmatter
    filename:
      template: "{primary}-{year}.md"
      field: create
    view:
      fields: [title_de, start]
      primary: title_de
      default:
        sort: start
        order: desc
    fields:
      - name: title_de
        label: Name der Reise (Deutsch)
        type: string
        required: true
        description: z. B. Südafrika oder Hawaii
      - name: title_en
        label: Name der Reise (Englisch)
        type: string
      - name: start
        label: Startdatum
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: end
        label: Enddatum
        type: date
        default: ""
        options:
          format: yyyy-MM-dd
      - name: countries
        label: Länder (zweistelliger Code)
        type: string
        list: true
        description: "z. B. ZA = Südafrika, US = USA, MU = Mauritius, CH = Schweiz, TH = Thailand, PT = Portugal"
      - name: cover
        label: Titelbild
        type: image
      - name: summary_de
        label: Kurzbeschreibung (Deutsch)
        type: text
      - name: summary_en
        label: Kurzbeschreibung (Englisch)
        type: text
      - name: text_de
        label: Reisebericht (Deutsch)
        type: rich-text
        options:
          format: markdown
      - name: text_en
        label: Reisebericht (Englisch)
        type: rich-text
        options:
          format: markdown
      - name: best_time_de
        label: Beste Reisezeit (Deutsch)
        type: string
      - name: best_time_en
        label: Beste Reisezeit (Englisch)
        type: string
      - name: budget_de
        label: Budget (Deutsch)
        type: string
        description: z. B. ca. CHF 4'500 pro Person inkl. Flug
      - name: budget_en
        label: Budget (Englisch)
        type: string
      - name: tip_de
        label: Unser Tipp (Deutsch)
        type: text
      - name: tip_en
        label: Unser Tipp (Englisch)
        type: text
      - name: stops
        label: Route (Stopps in Reihenfolge)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.name}"
        fields:
          - name: name
            label: Ort
            type: string
            required: true
          - name: lat
            label: Breitengrad
            type: number
            required: true
            description: In Google Maps Rechtsklick auf den Ort, erste Zahl.
          - name: lng
            label: Längengrad
            type: number
            required: true
            description: Zweite Zahl aus Google Maps.
          - name: note_de
            label: Notiz (Deutsch)
            type: string
          - name: note_en
            label: Notiz (Englisch)
            type: string
      - name: show_route
        label: Route als Linie auf der Karte zeigen
        type: boolean
        default: true
      - name: gallery
        label: Fotogalerie
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.caption_de}"
        fields:
          - name: image
            label: Foto
            type: image
            required: true
          - name: caption_de
            label: Bildtext (Deutsch)
            type: string
          - name: caption_en
            label: Bildtext (Englisch)
            type: string
      - name: draft
        label: Entwurf (noch nicht veröffentlichen)
        type: boolean
        default: false

  # ---------------- Reiseziele (Länderseiten) ----------------
  - name: destinations
    label: Reiseziele (Infos und Tipps pro Land)
    type: collection
    path: src/content/destinations
    format: yaml-frontmatter
    filename:
      template: "{fields.country}.md"
      field: create
    view:
      fields: [country, name_de]
      primary: country
    fields:
      - name: country
        label: Land (zweistelliger Code)
        type: string
        required: true
        description: "z. B. ZA = Südafrika, IT = Italien, US = USA. Das Land erscheint automatisch im Menü unter Reisen."
      - name: name_de
        label: Anderer Name im Menü (Deutsch, optional)
        type: string
      - name: name_en
        label: Anderer Name im Menü (Englisch, optional)
        type: string
      - name: cover
        label: Titelbild
        type: image
      - name: intro_de
        label: Einleitung (Deutsch)
        type: rich-text
        description: "Folgt auf „Wir sind Herr Domi und Frou Domi,“. Leer lassen = automatischer Text."
        options:
          format: markdown
      - name: intro_en
        label: Einleitung (Englisch)
        type: rich-text
        options:
          format: markdown
      - name: highlights
        label: Highlights
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.title_de}"
        fields:
          - name: title_de
            label: Titel (Deutsch)
            type: string
            required: true
          - name: title_en
            label: Titel (Englisch)
            type: string
          - name: image
            label: Foto
            type: image
          - name: text_de
            label: Text (Deutsch)
            type: text
          - name: text_en
            label: Text (Englisch)
            type: text
      - name: routes_de
        label: Routen-Tipps (Deutsch)
        type: rich-text
        description: "Leer lassen = Abschnitt wird nicht angezeigt."
        options:
          format: markdown
      - name: routes_en
        label: Routen-Tipps (Englisch)
        type: rich-text
        options:
          format: markdown
      - name: best_time_de
        label: Reisezeit (Deutsch)
        type: rich-text
        description: "Leer lassen = Abschnitt wird nicht angezeigt."
        options:
          format: markdown
      - name: best_time_en
        label: Reisezeit (Englisch)
        type: rich-text
        options:
          format: markdown
      - name: stay_de
        label: Unterkünfte (Deutsch)
        type: rich-text
        description: "Leer lassen = Abschnitt wird nicht angezeigt."
        options:
          format: markdown
      - name: stay_en
        label: Unterkünfte (Englisch)
        type: rich-text
        options:
          format: markdown
      - name: car_de
        label: Mietwagen (Deutsch)
        type: rich-text
        description: "Leer lassen = Abschnitt wird nicht angezeigt."
        options:
          format: markdown
      - name: car_en
        label: Mietwagen (Englisch)
        type: rich-text
        options:
          format: markdown
      - name: packing_de
        label: Packliste (Deutsch)
        type: rich-text
        description: "Leer lassen = Abschnitt wird nicht angezeigt."
        options:
          format: markdown
      - name: packing_en
        label: Packliste (Englisch)
        type: rich-text
        options:
          format: markdown
      - name: costs_de
        label: Kosten (Deutsch)
        type: rich-text
        description: "Leer lassen = Abschnitt wird nicht angezeigt."
        options:
          format: markdown
      - name: costs_en
        label: Kosten (Englisch)
        type: rich-text
        options:
          format: markdown
      - name: tips_de
        label: Weitere Tipps (Deutsch)
        type: rich-text
        description: "Leer lassen = Abschnitt wird nicht angezeigt."
        options:
          format: markdown
      - name: tips_en
        label: Weitere Tipps (Englisch)
        type: rich-text
        options:
          format: markdown

  # ---------------- Allgemeines ----------------
  - name: site
    label: Über uns und Links
    type: file
    path: src/data/site.json
    format: json
    fields:
      - name: about_de
        label: Über uns (Deutsch)
        type: rich-text
        options:
          format: markdown
      - name: about_en
        label: Über uns (Englisch)
        type: rich-text
        options:
          format: markdown
      - name: hero_title_de
        label: Startseite Überschrift (Deutsch)
        type: string
      - name: hero_title_en
        label: Startseite Überschrift (Englisch)
        type: string
      - name: hero_lead_de
        label: Startseite Einleitungstext (Deutsch)
        type: text
      - name: hero_lead_en
        label: Startseite Einleitungstext (Englisch)
        type: text
      - name: hero
        label: Fotos oben auf der Startseite (max. 3 Polaroids)
        type: object
        description: "Reihenfolge: 1 = vorne rechts, 2 = links, 3 = hinten unten. Leer lassen = neueste Reisen werden gezeigt."
        list:
          max: 3
          collapsible:
            collapsed: true
            summary: "{index}: {fields.caption_de}"
        fields:
          - name: image
            label: Foto
            type: image
            required: true
          - name: caption_de
            label: Text auf dem Polaroid (Deutsch)
            type: string
          - name: caption_en
            label: Text auf dem Polaroid (Englisch)
            type: string
          - name: link
            label: Link beim Antippen (optional)
            type: string
            description: "z. B. /reisen/suedafrika-2026/ (leer lassen = kein Link)"
      - name: photo_couple
        label: Paarfoto für die Reiseziel-Seiten
        type: image
      - name: planning_links
        label: Links „Reise planen“ (auf jeder Reiseziel-Seite)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.provider}"
        fields:
          - name: label_de
            label: Bezeichnung (Deutsch)
            type: string
          - name: label_en
            label: Bezeichnung (Englisch)
            type: string
          - name: provider
            label: Anbieter
            type: string
          - name: url
            label: Link (z. B. euer Partner-Link)
            type: string
          - name: icon
            label: Symbol
            type: select
            options:
              values: [plane, bed, ticket, car, link]
      - name: photo_oreo
        label: Foto Oreo
        type: image
      - name: photo_herr
        label: Foto Herr Domi
        type: image
      - name: photo_frou
        label: Foto Frou Domi
        type: image
      - name: instagram
        label: Instagram-Link
        type: string
      - name: tiktok
        label: TikTok-Link
        type: string
      - name: youtube
        label: YouTube-Link
        type: string
      - name: rednote
        label: RedNote-Link
        type: string
      - name: email
        label: Kontakt-E-Mail
        type: string
      - name: email_collab
        label: E-Mail für Kooperationen
        type: string

  # ---------------- Weltkarte ----------------
  - name: worldmap
    label: Weltkarte (bereiste Länder und Orte)
    type: file
    path: src/data/places.json
    format: json
    fields:
      - name: countries
        label: Bereiste Länder (zweistelliger Code)
        type: string
        list: true
        description: "z. B. FR = Frankreich, IT = Italien, US = USA, TH = Thailand, PT = Portugal. Länder aus Reisen werden automatisch ergänzt."
      - name: us_states
        label: Bereiste US-Bundesstaaten (Kürzel)
        type: string
        list: true
        description: "z. B. CA = Kalifornien, NV = Nevada, HI = Hawaii, FL = Florida, NY = New York"
      - name: places
        label: Besuchte Orte (Pins)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.name_de}"
        fields:
          - name: name_de
            label: Ort (Deutsch)
            type: string
            required: true
          - name: name_en
            label: Ort (Englisch)
            type: string
          - name: lat
            label: Breitengrad
            type: number
            required: true
            description: In Google Maps Rechtsklick auf den Ort, erste Zahl.
          - name: lng
            label: Längengrad
            type: number
            required: true
            description: Zweite Zahl aus Google Maps.
      - name: planned_countries
        label: Geplante Länder (zweistelliger Code)
        type: string
        list: true
        description: "Werden grün markiert und zählen noch nicht zum Prozentwert. Nach der Reise oben bei den bereisten Ländern eintragen und hier löschen."
      - name: planned_us_states
        label: Geplante US-Bundesstaaten (Kürzel)
        type: string
        list: true
      - name: planned_places
        label: Geplante Orte (Pins)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.name_de}"
        fields:
          - name: name_de
            label: Ort (Deutsch)
            type: string
            required: true
          - name: name_en
            label: Ort (Englisch)
            type: string
          - name: lat
            label: Breitengrad
            type: number
            required: true
          - name: lng
            label: Längengrad
            type: number
            required: true

  # ---------------- Zusammenarbeit ----------------
  - name: collab
    label: Zusammenarbeit (Seite für Brands)
    type: file
    path: src/data/collab.json
    format: json
    fields:
      - name: title_de
        label: Titel (Deutsch)
        type: string
      - name: title_en
        label: Titel (Englisch)
        type: string
      - name: lead_de
        label: Einleitung (Deutsch)
        type: text
      - name: lead_en
        label: Einleitung (Englisch)
        type: text
      - name: offers
        label: Angebote
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.title_de}"
        fields:
          - name: icon
            label: Symbol
            type: select
            options:
              values: [camera, video, phone, pin, plane, bed]
          - name: title_de
            label: Titel (Deutsch)
            type: string
          - name: title_en
            label: Titel (Englisch)
            type: string
          - name: text_de
            label: Beschreibung (Deutsch)
            type: text
          - name: text_en
            label: Beschreibung (Englisch)
            type: text
      - name: portfolio
        label: Beispiel-Fotos (Portfolio)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.caption_de}"
        fields:
          - name: image
            label: Foto
            type: image
            required: true
          - name: caption_de
            label: Bildtext (Deutsch)
            type: string
          - name: caption_en
            label: Bildtext (Englisch)
            type: string
      - name: why_de
        label: Warum mit uns (Deutsch)
        type: rich-text
        options:
          format: markdown
      - name: why_en
        label: Warum mit uns (Englisch)
        type: rich-text
        options:
          format: markdown
      - name: equipment_de
        label: Ausrüstung (Deutsch)
        type: string
      - name: equipment_en
        label: Ausrüstung (Englisch)
        type: string
      - name: languages_de
        label: Sprachen (Deutsch)
        type: string
      - name: languages_en
        label: Sprachen (Englisch)
        type: string
      - name: partners
        label: Bisherige Partner
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.name}"
        fields:
          - name: name
            label: Name
            type: string
            required: true
          - name: url
            label: Webseite (optional)
            type: string
      - name: mediakit
        label: Mediakit (PDF, optional)
        type: file
        options:
          categories: [document]
